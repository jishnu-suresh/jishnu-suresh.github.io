<main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-close" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" aria-label="Previous">&#8249;</button>
  <img id="lb-img" src="" alt="Photograph by Jishnu Suresh">
  <button class="lb-btn lb-next" aria-label="Next">&#8250;</button>
</div>

<script>
(function () {
  var N = 41;
  var names = [];
  for (var i = 1; i <= N; i++) names.push('p' + String(i).padStart(2, '0') + '.jpg');

  var gallery = document.getElementById('gallery');
  names.forEach(function (n, idx) {
    var img = document.createElement('img');
    img.src = 'photos/thumbs/' + n;
    img.loading = 'lazy';
    img.alt = 'Photograph by Jishnu Suresh';
    img.className = 'g-thumb';
    img.addEventListener('click', function () { open(idx); });
    gallery.appendChild(img);
  });

  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var current = 0;

  function open(i) {
    current = i;
    lbImg.src = 'photos/full/' + names[current];
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function close() {
    lb.hidden = true;
    lbImg.src = '';
    document.body.style.overflow = '';
  }
  function step(d) {
    current = (current + d + N) % N;
    lbImg.src = 'photos/full/' + names[current];
  }

  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
  lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
})();
</script>

</body>
</html>
